[shell_alias]
"ll" = "ls -alF"
"la" = "ls -A"
"l" = "ls -CF"
".." = "cd .."
"..." = "cd ../.."
"...." = "cd ../../.."
"ls" = "eza"
"cat" = "bat"
"find" = "fd"
"grep" = "rg"
"gs" = "git status"
"ga" = "git add"
"gc" = "git commit"
"gd" = "git diff"
"gl" = "git log --oneline --graph --decorate"
"gp" = "git push"
"gpl" = "git pull"
"rm" = "rm -i"
"cp" = "cp -i"
"mv" = "mv -i"
"cc" = "claude --dangerously-skip-permissions"
"cx" = "codex --yolo"
