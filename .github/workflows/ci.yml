name: ci

on:
  push:
    branches:
      - main
  pull_request:
  schedule:
    - cron: "0 18 * * 0"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  bootstrap:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, macos-15-intel]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install mise
        uses: jdx/mise-action@v5
        with:
          version: "2026.10.8"
          install: false
          cache: false
          env: false
          export_path: false
          add_shims_to_path: false

      - name: Bootstrap and check status
        env:
          MISE_GITHUB_TOKEN: ${{ github.token }}
          MISE_STATE_DIR: ${{ runner.temp }}/mise-state
          HOMEBREW_NO_AUTO_UPDATE: "1"
        shell: bash
        run: |
          mise trust
          # Hosted runners are disposable; replace their default shell dotfiles.
          mise bootstrap --yes --update --force-dotfiles --skip user
          # Apply only the login shell with sudo, targeting the original SUDO_USER.
          # Keep root from recording history using its own HOME in the user's store.
          sudo --preserve-env=MISE_STATE_DIR env MISE_HISTORY_ENABLED=false "$(command -v mise)" -C "$PWD" bootstrap user apply --yes
          mise bootstrap status --missing
          mise bootstrap dotfiles status --missing
