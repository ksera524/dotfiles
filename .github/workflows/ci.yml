name: ci

on:
  push:
    branches:
      - main
  pull_request:
  schedule:
    - cron: "0 18 * * 0"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  bootstrap:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, macos-15-intel]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install mise
        uses: jdx/mise-action@v5
        with:
          version: "2026.10.8"
          install: false
          cache: false
          env: false
          export_path: false
          add_shims_to_path: false

      - name: Bootstrap and check status
        env:
          MISE_GITHUB_TOKEN: ${{ github.token }}
          MISE_STATE_DIR: ${{ runner.temp }}/mise-state
          HOMEBREW_NO_AUTO_UPDATE: "1"
        shell: bash
        run: |
          mise trust
          # Keep ordinary startup files, including the Ubuntu default .bashrc.
          mkdir -p "$HOME/.config/fish"
          printf '\n# dotfiles-ci-preserve\n' >> "$HOME/.bashrc"
          printf '\n# dotfiles-ci-preserve\n' >> "$HOME/.bash_profile"
          printf '\n# dotfiles-ci-preserve\n' >> "$HOME/.config/fish/config.fish"
          # Hosted runners are disposable; replace other conflicting dotfiles.
          mise bootstrap --yes --update --force-dotfiles --skip user
          # Apply only the login shell with sudo, targeting the original SUDO_USER.
          # Keep root from recording history using its own HOME in the user's store.
          sudo --preserve-env=MISE_STATE_DIR env MISE_HISTORY_ENABLED=false "$(command -v mise)" -C "$PWD" bootstrap user apply --yes
          mise bootstrap status --missing
          mise bootstrap dotfiles status --missing
          mise bootstrap --only dotfiles,mise-shell-activate --yes
          set -x
          for startup in "$HOME/.bashrc" "$HOME/.bash_profile" "$HOME/.config/fish/config.fish"; do
            test ! -L "$startup"
            test "$(grep -c '^# dotfiles-ci-preserve$' "$startup")" = 1
            test "$(grep -c '^# >>> mise:activate >>>' "$startup")" = 1
          done
          bash -lic 'alias gs && type cdd && node --version'
          fish -ic 'functions -q gs; and functions -q cdd; and node --version'

      - name: Isolated regression checks
        shell: bash
        run: mise exec -- python -B -m unittest discover -s tests -v
